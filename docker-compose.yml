version: '3.8'
services:
  codewave:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_BACKEND_BASE=http://backend:3001
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped
  backend:
    build: ./backend
    container_name: compartilhamais-backend
    ports:
      - "3001:3001"
